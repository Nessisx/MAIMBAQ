<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="../manifest.json" />
    <meta name="theme-color" content="#B96863" />
    <link rel="apple-touch-icon" href="../frontend/src/assets/icons/icon-192.png" />
    <title>MAIMBAQ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../frontend/src/css/base.css" />
    <link rel="stylesheet" href="../frontend/src/css/datos.css" />
  </head>
  <body>
    <header class="header">
      <div class="header-inner">
        <a
          class="back-btn"
          href="dashboard.html"
          aria-label="Volver al dashboard"
          >←</a
        >
        <div class="avatar">🧒</div>
        <div class="logo">
          <span class="ma">M</span><span class="im">AI</span
          ><span class="baq">MBAQ</span>
        </div>
        <button class="settings-btn" aria-label="Configuración">⚙️</button>
      </div>
    </header>

    <section class="page" id="page-datos">
      <div class="page-inner">
        <div id="datos-content">
          <div class="datos-art-preview">
            <img
              id="preview-foto"
              class="art-preview-img"
              src=""
              alt="Vista previa del dibujo"
            />
            <div id="preview-placeholder" class="art-emoji">🎨</div>
            <div class="photo-actions">
              <button
                id="btn-captura"
                class="edit-float edit-float-camera"
                type="button"
                aria-label="Tomar una foto"
              >
                📷
              </button>
              <button
                id="btn-galeria"
                class="edit-float edit-float-gallery"
                type="button"
                aria-label="Elegir una imagen"
              >
                🖼️
              </button>
            </div>
            <input
              id="input-foto-camara"
              class="foto-input"
              type="file"
              accept="image/*"
              capture="environment"
            />
            <input
              id="input-foto-galeria"
              class="foto-input"
              type="file"
              accept="image/*"
            />
          </div>
          <p id="foto-status" class="foto-status">
            Toca la cámara para tomar una foto o usa la galería para subir una
            imagen.
          </p>

          <div class="datos-title">Hora de crear<br />arte!</div>
          <div class="datos-subtitle">
            Cuéntanos sobre tu increíble<br />idea antes de que lo mostremos al
            mundo!
          </div>

          <div class="field-group">
            <div class="field-label">✨ Nombre de tu obra</div>
            <input
              class="field-input"
              id="input-obra"
              type="text"
              placeholder="Dragón espacial"
            />
          </div>

          <div class="field-group">
            <div class="field-label">😊 Tu nombre (artista)</div>
            <input
              class="field-input"
              id="input-artista"
              type="text"
              placeholder="Picasso Jr."
              oninput="document.getElementById('artista-err').textContent = ''"
            />
            <div class="field-err" id="artista-err" role="alert" aria-live="polite"></div>
          </div>

          <div class="field-group">
            <div class="field-label">😊 Estilo</div>
            <input
              class="field-input"
              id="input-estilo"
              type="text"
              placeholder="DaVinci"
            />
          </div>

          <button class="vamos-btn" type="button" onclick="startGenerating()">
            VAMOS! 🚀
          </button>
        </div>
      </div>
    </section>

    <nav class="bottom-nav">
      <div class="bottom-nav-inner">
        <a class="nav-item active" href="/MAIMBAQ/index.html">📷<span>Crear</span></a>
        <a class="nav-item" href="/MAIMBAQ/pages/museo.html">🎨<span>Museo</span></a>
        <a class="nav-item" href="/MAIMBAQ/frontend/src/apps/poseai/poseai.html">🎮<span>Juega con IA</span></a>
        <a class="nav-item" href="/MAIMBAQ/pages/sobre.html">ℹ️<span>Sobre</span></a>
      </div>
    </nav>

    <script src="../frontend/src/js/usernameModeration.js"></script>
    <script src="../frontend/src/js/app.js"></script>
  </body>
</html>
