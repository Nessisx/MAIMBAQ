<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="../manifest.json" />
    <meta name="theme-color" content="#F5A623" />
    <link rel="apple-touch-icon" href="../frontend/src/icons/icon-192.png" />
    <title>MAIMBAQ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../frontend/src/css/base.css" />
    <link rel="stylesheet" href="../frontend/src/css/resultado.css" />
  </head>
  <body>
    <header class="header">
      <div class="header-inner">
        <div class="avatar">🧒</div>
        <div class="logo">
          <span class="ma">M</span><span class="im">AI</span
          ><span class="baq">MBAQ</span>
        </div>
        <button class="settings-btn" aria-label="Configuración">⚙️</button>
      </div>
    </header>

    <section class="page" id="page-resultado">
      <div class="result-img-wrap">
        <img
          class="result-photo"
          id="result-photo"
          src=""
          alt="Foto de la obra"
        />
        <div class="result-img" id="result-emoji-big">🐉</div>
        <div class="tu-obra-badge">✦ TU OBRA!</div>
      </div>

      <div class="info-card">
        <div class="info-card-title">📄 Información</div>
        <div class="info-row">
          <span class="label">Nombre de la obra</span
          ><span class="value dark" id="res-nombre">Dragon arcoiris</span>
        </div>
        <div class="info-row">
          <span class="label">Artista</span
          ><span class="value" id="res-artista">Robertihno Jr.</span>
        </div>
        <div class="info-row">
          <span class="label">Estilo</span
          ><span class="value" id="res-estilo">DaVinci</span>
        </div>
        <div class="info-row">
          <span class="label">Fecha</span
          ><span class="value dark" id="res-fecha">—</span>
        </div>
      </div>

      <button class="guardar-btn">🏛 Guardar en el museo</button>
      <button class="compartir-btn">🔗 Compartir</button>
    </section>

    <nav class="bottom-nav">
      <div class="bottom-nav-inner">
        <a class="nav-item" href="../index.html">📷<span>Crear</span></a>
        <a class="nav-item" href="museo.html">🎨<span>Museo</span></a>
        <a class="nav-item" href="sobre.html">ℹ️<span>Sobre</span></a>
      </div>
    </nav>

    <script src="../frontend/src/js/app.js"></script>
  </body>
</html>
